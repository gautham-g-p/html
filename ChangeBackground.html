<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Background Color</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f7;
      color: #1f2937;
      transition: background-color 350ms ease;
    }
    .card {
      width: min(480px, 100%);
      padding: 36px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.13);
    }
    .swatch {
      width: 66px;
      height: 66px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #eef2f7;
      border: 1px solid #d1d5db;
      transition: background-color 350ms ease;
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 4vw, 2.1rem); }
    p { margin: 0 0 22px; color: #5b6473; line-height: 1.55; }
    button {
      padding: 13px 22px;
      border: 0;
      border-radius: 10px;
      background: #182238;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(24, 34, 56, 0.2);
      transition: transform 150ms ease, background-color 150ms ease;
    }
    button:hover { background: #2b3a58; transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #f4c95d; outline-offset: 4px; }
    .color-code { margin-top: 18px; font-family: monospace; color: #374151; }
  </style>
</head>
<body>
  <main class="card">
    <div class="swatch" id="colorSwatch" aria-hidden="true"></div>
    <h1>Random Background Color</h1>
    <p>Click the button to generate a random color and apply it to the page background.</p>
    <button type="button" id="changeButton">Change Background</button>
    <div class="color-code" id="colorCode" aria-live="polite">Current color: #EEF2F7</div>
  </main>

  <script>
    const button = document.getElementById("changeButton");
    const colorCode = document.getElementById("colorCode");
    const colorSwatch = document.getElementById("colorSwatch");

    function generateRandomColor() {
      const digits = "0123456789ABCDEF";
      let color = "#";
      for (let i = 0; i < 6; i++) {
        color += digits[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    button.addEventListener("click", function () {
      const randomColor = generateRandomColor();
      document.body.style.backgroundColor = randomColor;
      colorSwatch.style.backgroundColor = randomColor;
      colorCode.textContent = "Current color: " + randomColor;
    });
  </script>
</body>
</html>
